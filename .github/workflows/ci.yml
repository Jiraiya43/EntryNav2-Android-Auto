# Checks that need no copy of the car's system: style, repository content, PC tests.
# The SDK job builds ARM with link-only stubs; car-library validation remains a developer's task.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Style, content and PC tests
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates dbus g++ gcc git libdbus-1-dev libssl-dev make \
            pkg-config protobuf-compiler python3 python3-protobuf python3-venv shellcheck
          python3 -m venv /opt/style
          /opt/style/bin/pip install --quiet clang-format==18.1.8 ruff==0.6.9
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify_repo.py reads every commit
      - name: Style
        run: make style STYLE_TOOLS=/opt/style/bin RUFF=/opt/style/bin/ruff
      - name: Content
        run: |
          git config --global --add safe.directory "$PWD"
          make verify_core verify_repo
      - name: PC tests
        run: make test-host HOST_CXX=g++

  sanitizers:
    name: PC sanitizers (ASan, UBSan, leaks)
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 15
    steps:
      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates g++ git libssl-dev make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PC tests with ASan, UBSan and LSan
        run: make -j2 test-host-sanitizers

  arm-sdk:
    name: ARM link-only SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils python3-pyelftools
      - name: Build ARM SDK and binaries
        run: |
          docker build -t entrynav2-tc:4.7 toolchain
          docker build -f toolchain/Dockerfile.sdk -t entrynav2-sdk:4.7 toolchain
          HU_ROOTFS=/nonexistent-rootfs bash toolchain/tc.sh --sdk make -j4 all
      - name: Check ARM ELF contracts
        run: |
          /usr/bin/python3 tools/verify_sdk.py
          /usr/bin/python3 -m unittest discover -s tests -p test_sdk.py

